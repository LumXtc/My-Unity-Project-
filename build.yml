name: Build Windows
on: [push, workflow_dispatch]
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -G "Visual Studio 17 2022" -A x64
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Installer
        run: |
          choco install innosetup -y
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\omnichord.iss
      - uses: actions/upload-artifact@v4
        with:
          name: OmnichordVirtual-Windows
          path: |
            build/OmnichordVirtual_artefacts/Release/Standalone/*.exe
            build/OmnichordVirtual_artefacts/Release/VST3/**
            installer/Output/*.exe
